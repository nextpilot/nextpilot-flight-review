name: release-packages

# 三平台发布包：Linux AppImage / Windows 安装器+便携包 / macOS dmg。
#
# 触发：推 v* tag 或手动 workflow_dispatch。
#
# ⚠️ 运行平台：本文件是 GitHub Actions 配置。Gitee 主仓不会执行它，
#    需要仓库同时镜像到 GitHub（或在本机直接跑 tools/pack-*.sh）。
#    三个 job 各自在原生 runner 上构建：macOS 包只能在 macOS 上出，
#    Windows 安装器必须在 Windows 上做 windeployqt。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04      # glibc 2.35 基线，与 linuxdeploy 兼容
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 校验版本（versions.env 唯一来源）
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_VER=${PS_APP_VERSION}" >> "$GITHUB_ENV"
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"
          grep -q "project(PlotScope VERSION ${PS_APP_VERSION}" CMakeLists.txt \
            || { echo "::error::CMakeLists 的 project VERSION 与 versions.env 不一致"; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v${PS_APP_VERSION}" ] \
              || { echo "::error::tag ${GITHUB_REF_NAME} 必须等于 v${PS_APP_VERSION}"; exit 1; }
          fi

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf build-essential curl file \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Qt 6.2.4
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          modules: 'qtcharts'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-release

      - name: 配置 + 构建
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/gcc_64" \
            -DPS_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target plotscope-gui plotscope -j"$(nproc)"

      - name: 出 AppImage
        run: bash tools/pack-appimage.sh build dist "$QT_ROOT_DIR/gcc_64"

      - name: 冒烟（清空环境直接跑）
        run: |
          chmod +x dist/*.AppImage
          env -i HOME="$HOME" PATH=/usr/bin:/bin dist/PlotScope-*.AppImage --cli --help

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 校验版本（versions.env 唯一来源）
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_VER=${PS_APP_VERSION}" >> "$GITHUB_ENV"
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"
          grep -q "project(PlotScope VERSION ${PS_APP_VERSION}" CMakeLists.txt \
            || { echo "::error::CMakeLists 的 project VERSION 与 versions.env 不一致"; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v${PS_APP_VERSION}" ] \
              || { echo "::error::tag ${GITHUB_REF_NAME} 必须等于 v${PS_APP_VERSION}"; exit 1; }
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装 Qt 6.2.4 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 确保 NSIS
        shell: pwsh
        run: |
          $n = "$env:ProgramFiles\NSIS\makensis.exe"
          if (-not (Test-Path $n)) { choco install nsis -y --no-progress }

      - name: sccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: windows-release
          variant: sccache

      - name: 配置 + 构建
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR\msvc2019_64" `
            -DPS_BUILD_TESTS=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build --target plotscope-gui plotscope

      - name: 出安装器 + 便携包
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/pack-windows.ps1 `
            -BuildDir build -QtDir "$env:QT_ROOT_DIR\msvc2019_64" -OutDir dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14        # Apple Silicon
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 校验版本（versions.env 唯一来源）
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_VER=${PS_APP_VERSION}" >> "$GITHUB_ENV"
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"
          grep -q "project(PlotScope VERSION ${PS_APP_VERSION}" CMakeLists.txt \
            || { echo "::error::CMakeLists 的 project VERSION 与 versions.env 不一致"; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v${PS_APP_VERSION}" ] \
              || { echo "::error::tag ${GITHUB_REF_NAME} 必须等于 v${PS_APP_VERSION}"; exit 1; }
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: 工具
        run: |
          command -v ninja || HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja
          xcodebuild -version

      - name: 安装 Qt 6.2.4
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          host: mac
          modules: 'qtcharts'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-release

      - name: 配置 + 构建
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(pwd)/$QT_ROOT_DIR/macos" \
            -DPS_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target plotscope-gui plotscope -j"$(sysctl -n hw.ncpu)"

      - name: 出 .app + dmg
        env:
          # 有证书/公证凭据就签名+公证；没有则脚本自动走 ad-hoc 签名。
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash tools/pack-macos.sh build dist "$(pwd)/$QT_ROOT_DIR/macos"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -lh out

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
