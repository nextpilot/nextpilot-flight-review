name: build-packages

# Three-platform release packages: Linux AppImage + DEB / Windows installer + portable ZIP / macOS DMG.
#
# Triggers (three modes, plan A: validation builds and formal releases are layered):
#   1. Push a branch whose name ends with -workflow-packaging -> build, package and smoke-test
#      on all three platforms; artifacts are uploaded only, no Release is created
#      (the release job is gated on a tag and will be skipped).
#      Use this to regress packaging-script/CI changes just by pushing the marked branch,
#      without a manual dispatch.
#   2. Push a v* tag -> full release; build artifacts are attached to the GitHub Release.
#   3. Manual workflow_dispatch -> same as a tag, but with a manually chosen ref.
#
# NOTE: This is GitHub Actions configuration. The Gitee primary repository does not run it;
#   the repo must also be mirrored to GitHub (or run tools/pack-*.sh locally).
#   Gitee pushes sync to GitHub, so pushing the marked branch triggers this workflow.
#   Each job builds on its native runner: macOS packages can only be produced on macOS,
#   and the Windows installer must be built with windeployqt on Windows.

on:
  push:
    branches: ['**/*-workflow-packaging']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04      # glibc 2.35 baseline, compatible with linuxdeploy
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_VER=${PS_APP_VERSION}" >> "$GITHUB_ENV"
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"
          grep -q "project(PlotScope VERSION ${PS_APP_VERSION}" CMakeLists.txt \
            || { echo "::error::CMakeLists project VERSION does not match versions.env"; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v${PS_APP_VERSION}" ] \
              || { echo "::error::tag ${GITHUB_REF_NAME} must equal v${PS_APP_VERSION}"; exit 1; }
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf build-essential curl file \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install Qt 6.2.4
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          modules: 'qtcharts'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-release

      - name: Configure CMake
        run: |
          # QT_ROOT_DIR already contains gcc_64 (install-qt-action v4); do not append another level.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPS_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build targets (plotscope-gui, plotscope)
        run: cmake --build build --target plotscope-gui plotscope -j"$(nproc)"

      - name: Build AppImage
        run: bash tools/pack-appimage.sh build dist "$QT_ROOT_DIR"

      - name: Build DEB package
        run: bash tools/pack-deb.sh build dist

      - name: Smoke test - AppImage CLI
        run: |
          chmod +x dist/*.AppImage
          # The runner has no FUSE; use extract-and-run, otherwise fusermount is missing.
          env -i HOME="$HOME" PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 \
            dist/PlotScope-*.AppImage --cli --help
          echo "AppImage CLI smoke test passed"

      - name: Smoke test - AppImage GUI (offscreen)
        run: |
          # The AppImage GUI must also open a window (offscreen); not exiting within 10s (124) means success.
          set +e
          env -i HOME="$HOME" PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 \
            QT_QPA_PLATFORM=offscreen timeout 10 dist/PlotScope-*.AppImage
          AI_RC=$?
          set -e
          [ "$AI_RC" -eq 124 ] || { echo "::error::AppImage GUI failed to start (exit code $AI_RC)"; exit 1; }
          echo "AppImage GUI smoke test passed"

      - name: Smoke test - DEB CLI
        run: |
          # DEB: extract and run the real binary (FHS layout, RPATH=$ORIGIN/lib).
          mkdir -p /tmp/deb-root
          dpkg-deb -x dist/*.deb /tmp/deb-root
          env -i HOME="$HOME" PATH=/usr/bin:/bin /tmp/deb-root/usr/lib/plotscope/plotscope --help
          echo "DEB CLI smoke test passed"

      - name: Smoke test - DEB GUI (offscreen)
        run: |
          # This is the core value of the DEB: the CLI does not touch platform plugins,
          # so passing the CLI does not prove the GUI can start.
          set +e
          env -i HOME="$HOME" PATH=/usr/bin:/bin QT_QPA_PLATFORM=offscreen \
            timeout 10 /tmp/deb-root/usr/lib/plotscope/plotscope-gui
          GUI_RC=$?
          set -e
          [ "$GUI_RC" -eq 124 ] || { echo "::error::DEB GUI failed to start (exit code $GUI_RC)"; exit 1; }
          echo "DEB GUI smoke test passed (offscreen window opened, timed out without exit)"

      - name: Audit ELF glibc baseline (<= 2.35)
        run: |
          set -euo pipefail
          FLOOR=2.35
          # shellcheck disable=SC2016  # $0 is expanded by the inner sh, not by this shell
          MAX="$(find dist/AppDir -type f \( -name '*.so*' -o -perm -u+x \) -print0 2>/dev/null \
            | xargs -0 -r -n1 sh -c 'objdump -T "$0" 2>/dev/null | grep -oE "GLIBC_[0-9]+\.[0-9]+"' \
            | sed 's/GLIBC_//' | sort -V | tail -1 || true)"
          if [ -z "$MAX" ]; then echo "::error::No GLIBC requirement extracted from AppDir"; exit 1; fi
          echo "Highest glibc requirement: $MAX"
          NEED="$(printf '%s\n%s\n' "$FLOOR" "$MAX" | sort -V | tail -1)"
          if [ "$NEED" != "$FLOOR" ]; then
            echo "::error::glibc baseline $MAX exceeds $FLOOR; older distributions would be blocked"; exit 1
          fi
          echo "glibc baseline audit passed (<= $FLOOR, matching ubuntu-22.04 builder)"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_VER=${PS_APP_VERSION}" >> "$GITHUB_ENV"
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"
          grep -q "project(PlotScope VERSION ${PS_APP_VERSION}" CMakeLists.txt \
            || { echo "::error::CMakeLists project VERSION does not match versions.env"; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v${PS_APP_VERSION}" ] \
              || { echo "::error::tag ${GITHUB_REF_NAME} must equal v${PS_APP_VERSION}"; exit 1; }
          fi

      - name: Install Rust toolchain (MSVC target)
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Qt 6.2.4 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'

      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          $n = "$env:ProgramFiles\NSIS\makensis.exe"
          if (-not (Test-Path $n)) { choco install nsis -y --no-progress }

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: windows-release
          variant: sccache

      - name: Configure CMake
        shell: pwsh
        run: |
          # QT_ROOT_DIR already contains msvc2019_64 (install-qt-action v4); do not append another level.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DPS_BUILD_TESTS=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build targets (plotscope-gui, plotscope)
        shell: pwsh
        run: cmake --build build --target plotscope-gui plotscope

      - name: Build installer and portable archive
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/pack-windows.ps1 `
            -BuildDir build -QtDir "$env:QT_ROOT_DIR" -OutDir dist

      - name: Smoke test - silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*windows-*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "Installer not found" }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $cli = "$env:ProgramFiles\PlotScope\bin\plotscope.exe"
          if (-not (Test-Path $cli)) { throw "Could not find $cli after silent install" }
          "Silent install smoke test passed"

      - name: Smoke test - installed CLI
        shell: pwsh
        run: |
          $cli = "$env:ProgramFiles\PlotScope\bin\plotscope.exe"
          if (-not (Test-Path $cli)) { throw "Could not find $cli" }
          & $cli --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI smoke test failed (exit $LASTEXITCODE)" }
          "Installed CLI smoke test passed"

      - name: Smoke test - uninstall
        shell: pwsh
        run: |
          & "$env:ProgramFiles\PlotScope\uninstall.exe" /S
          Start-Sleep -Seconds 5
          if (Test-Path "$env:ProgramFiles\PlotScope") { throw "Installation directory still exists after uninstall" }
          "Uninstall smoke test passed"

      - name: Upload Windows packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  macos:
    # Two architectures in one matrix. An Intel Mac can only launch an x86_64 .app and an Apple
    # Silicon Mac an arm64 one, so each leg builds natively; macos-13/14 are retired in 2026,
    # which makes macos-15-intel the only Intel label left. The Qt 6.2.4 clang_64 package is
    # universal, so both legs install the same Qt.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon (arm64)
            arch: arm64
          - os: macos-15-intel  # Intel (x86_64)
            arch: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_VER=${PS_APP_VERSION}" >> "$GITHUB_ENV"
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"
          grep -q "project(PlotScope VERSION ${PS_APP_VERSION}" CMakeLists.txt \
            || { echo "::error::CMakeLists project VERSION does not match versions.env"; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v${PS_APP_VERSION}" ] \
              || { echo "::error::tag ${GITHUB_REF_NAME} must equal v${PS_APP_VERSION}"; exit 1; }
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install build tools (ninja, Xcode)
        run: |
          command -v ninja || HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja
          xcodebuild -version

      - name: Install Qt 6.2.4
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          host: mac
          modules: 'qtcharts'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-release-${{ matrix.arch }}

      - name: Configure CMake
        run: |
          # QT_ROOT_DIR is already an absolute path containing clang_64 (install-qt-action v4);
          # do not prepend $(pwd)/ or append /macos.
          # CMAKE_OSX_ARCHITECTURES is pinned to the runner's own architecture so the .app is a
          # single-arch binary the matching Mac can launch; tools/pack-macos.sh names the DMG
          # after `uname -m`, so the two legs produce arm64 / x86_64 files.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DPS_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build targets (plotscope-gui, plotscope)
        run: cmake --build build --target plotscope-gui plotscope -j"$(sysctl -n hw.ncpu)"

      - name: Build .app bundle and DMG
        env:
          # With signing/notarization credentials the script signs and notarizes;
          # otherwise it falls back to ad-hoc signing.
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash tools/pack-macos.sh build dist "$QT_ROOT_DIR"

      - name: Smoke test - DMG CLI
        run: |
          set -euo pipefail
          MP="$(mktemp -d)/psdmg"
          mkdir -p "$MP"
          hdiutil attach dist/*.dmg -mountpoint "$MP" -nobrowse -quiet
          trap 'hdiutil detach "$MP" -quiet || true' EXIT
          "$MP/PlotScope.app/Contents/MacOS/plotscope" --help >/dev/null
          echo "DMG CLI smoke test passed after mounting"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts into output directory
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -lh out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
