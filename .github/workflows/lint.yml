name: lint

# Script and workflow lint gate.
#
# Catches the class of breakage that compiles fine and passes code review, but only
# fails when the packaging pipeline actually runs: a wrong linuxdeploy flag order,
# a doubled Qt kit path, an unknown runner label. bash -n does not catch these,
# and neither does the compiler.
#
# Kept separate from ci.yml on purpose: this finishes in seconds while the build gate
# takes ~90 minutes, so a lint failure reports immediately instead of sitting behind
# a build queue.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so the gate is reproducible; bump deliberately, not silently.
  ACTIONLINT_VERSION: 1.7.12

jobs:
  shell:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: bash -n (all scripts)
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then echo "::error::no shell script tracked"; exit 1; fi
          for f in "${files[@]}"; do bash -n "$f"; done
          echo "bash -n passed: ${#files[@]} scripts"

      - name: shellcheck (error severity)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version
          mapfile -t files < <(git ls-files '*.sh')
          # error only: historic scripts carry style warnings that would turn the gate
          # red wholesale. Warnings stay visible locally; ratchet to them separately.
          shellcheck -S error -x "${files[@]}"
          echo "shellcheck passed: ${#files[@]} scripts"

  workflows:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: actionlint
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/al.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint -version
          # Also checks the shell snippets embedded in `run:` blocks via shellcheck.
          /tmp/actionlint -color .github/workflows/*.yml

  format:
    # Changed-lines-only clang-format gate.
    #
    # The tree is NOT clang-format clean: on the closest possible config a whole-file
    # pass still rewrites ~17% of its lines. A bulk reformat would destroy git blame,
    # so the gate deliberately looks only at lines this change touches. `git
    # clang-format --diff <base>` does exactly that and exits non-zero on any drift.
    #
    # src/3rdparty is excluded: vendored code keeps its upstream formatting
    # (see .clang-format-ignore for the in-editor side of the same rule).
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the gate diffs against the base branch commit.
          fetch-depth: 0

      - name: Fetch clang-format (pinned)
        run: |
          set -euo pipefail
          # Version is pinned to what developers install locally: clang-format output
          # differs across releases, so an unpinned install would make the gate flaky.
          #
          # Deliberately does NOT use `pip install --user`: on the runner that drops
          # console scripts into ~/.local/bin, and GITHUB_PATH only takes effect for
          # *later* steps, so the same-step `clang-format --version` probe cannot see
          # them. That step was observed failing with an opaque exit code 16 — unrelated
          # to formatting. Extracting the wheel gives one static binary and no
          # site-packages/entry-point indirection at all.
          python3 -m pip download --no-deps -q -d "$RUNNER_TEMP/cf" 'clang-format==23.1.5'
          W="$(find "$RUNNER_TEMP/cf" -maxdepth 1 -name '*.whl' -print -quit)"
          python3 -m zipfile -e "$W" "$RUNNER_TEMP/cf/x"
          CF="$RUNNER_TEMP/cf/x/clang_format/data/bin/clang-format"
          chmod +x "$CF"
          "$CF" --version
          echo "CLANG_FORMAT_BIN=$CF" >> "$GITHUB_ENV"
          echo "CLANG_FORMAT_PY=$RUNNER_TEMP/cf/x" >> "$GITHUB_ENV"

      - name: Format changed lines only
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            # Force-push can leave an unreachable "before"; fall back to the parent.
            git cat-file -e "${BASE}^{commit}" 2>/dev/null || BASE="$(git rev-parse HEAD~1)"
          fi
          echo "base = $BASE"
          mapfile -t FILES < <(git diff --name-only --diff-filter=d "$BASE"...HEAD -- '*.cpp' '*.h' '*.hpp' \
            | grep -v -e '/3rdparty/' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then echo "no C++ changes, nothing to check"; exit 0; fi
          printf '%s\n' "${FILES[@]}"
          # Exits non-zero as soon as one changed line differs from the formatter output.
          # git-clang-format ships inside the wheel, so run it as a module via PYTHONPATH
          # instead of relying on a console script from pip.
          PYTHONPATH="$CLANG_FORMAT_PY" python3 -m clang_format.git_clang_format \
            --binary "$CLANG_FORMAT_BIN" --diff "$BASE" -- "${FILES[@]}"

  markdown:
    # Changed-files-only markdown gate: prettier (layout) + markdownlint-cli2 (structure).
    #
    # prettier is the only formatter. markdownlint's default MD060 expects `|x|y|`
    # tables while prettier emits `| x | y |`, so .markdownlint-cli2.jsonc pins MD060
    # to leading_and_trailing and the two never fight. MD013 is off: this tree is
    # Chinese prose, an 80-column budget produces nothing but noise.
    #
    # Versions are pinned here and in tools/format.sh on purpose: formatter output
    # drifts between releases, and a skew shows up as "clean locally, red in CI".
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PRETTIER_VERSION: 3.10.1
      MARKDOWNLINT_VERSION: 0.19.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve base
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            B="origin/${{ github.base_ref }}"
          else
            B="${{ github.event.before }}"
            git cat-file -e "${B}^{commit}" 2>/dev/null || B="$(git rev-parse HEAD~1)"
          fi
          echo "base=$B" >> "$GITHUB_OUTPUT"

      - name: prettier --check (changed markdown)
        run: tools/format.sh --check "${{ steps.base.outputs.base }}" --only md

      - name: markdownlint (changed markdown)
        run: |
          set -euo pipefail
          B="${{ steps.base.outputs.base }}"
          mapfile -t FILES < <(git -c core.quotePath=false diff --name-only --diff-filter=d \
            "$B...HEAD" -- '*.md' | grep -v '^src/3rdparty/' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then echo "no markdown changes"; exit 0; fi
          printf '%s\n' "${FILES[@]}"
          npx --yes "markdownlint-cli2@${MARKDOWNLINT_VERSION}" "${FILES[@]}"

  python:
    # Changed-files-only python gate: ruff format --check + ruff check.
    #
    # ruff does both jobs (no black + flake8 + isort). The version is read from
    # tools/requirements.txt so CI and the developer venv cannot drift apart.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install ruff (pinned in tools/requirements.txt)
        run: |
          set -euo pipefail
          V="$(sed -n 's/^ruff==//p' tools/requirements.txt)"
          if [ -z "$V" ]; then echo "::error::ruff is not pinned in tools/requirements.txt"; exit 1; fi
          python3 -m pip install --user "ruff==$V"
          "$HOME/.local/bin/ruff" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve base
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            B="origin/${{ github.base_ref }}"
          else
            B="${{ github.event.before }}"
            git cat-file -e "${B}^{commit}" 2>/dev/null || B="$(git rev-parse HEAD~1)"
          fi
          echo "base=$B" >> "$GITHUB_OUTPUT"

      - name: ruff (changed python)
        run: tools/format.sh --check "${{ steps.base.outputs.base }}" --only py

  tidy:
    # Changed-files-only clang-tidy pass — the companion to `format`. Formatting catches
    # layout; this catches defects layout cannot see: use-after-move, uninitialised
    # locals, implicit narrowing, dangling references.
    #
    # Report-only on first landing: the point is to measure what the current tree
    # produces. Turning it into a hard gate before knowing the baseline would make every
    # PR red on pre-existing findings, and a permanently red check gets ignored. Once
    # the baseline is clean, promote a subset via WarningsAsErrors in .clang-tidy.
    #
    # Only translation units are checked: clang-tidy needs a compile_commands entry, and
    # those exist for .cpp but not for headers. Headers are still covered through
    # HeaderFilterRegex whenever a touched .cpp includes them.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect changed C++ sources
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            git cat-file -e "${BASE}^{commit}" 2>/dev/null || BASE="$(git rev-parse HEAD~1)"
          fi
          echo "base = $BASE"
          mapfile -t FILES < <(git diff --name-only --diff-filter=d "$BASE"...HEAD \
            -- '*.cpp' '*.cxx' | grep -v -e '/3rdparty/' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "no C++ translation units changed, nothing to tidy"
            exit 0
          fi
          printf '%s\n' "${FILES[@]}"
          printf 'files=%s\n' "${FILES[*]}" >> "$GITHUB_OUTPUT"

      - name: Install clang-tidy
        if: steps.changed.outputs.files != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy ninja-build
          clang-tidy --version

      - name: Read Qt version
        if: steps.changed.outputs.files != ''
        run: |
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install Qt
        if: steps.changed.outputs.files != ''
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          modules: 'qtcharts'

      - name: Install Rust toolchain
        if: steps.changed.outputs.files != ''
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Generate compile_commands.json
        if: steps.changed.outputs.files != ''
        run: |
          # Configure only — clang-tidy needs the translation unit's flags, not the binaries.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPS_BUILD_TESTS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on changed files
        if: steps.changed.outputs.files != ''
        run: |
          set +e
          LOG="$RUNNER_TEMP/tidy.log"
          : > "$LOG"
          for f in ${{ steps.changed.outputs.files }}; do
            echo "=== $f ===" | tee -a "$LOG"
            clang-tidy -p build "$f" 2>&1 | tee -a "$LOG"
          done
          N=$(grep -c 'warning:' "$LOG")
          echo "clang-tidy findings: $N"
          {
            echo "### clang-tidy (report-only): ${N} warning(s)"
            echo '```'
            grep 'warning:' "$LOG" | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Report-only for now: never fail the run on findings.
          exit 0

      - name: Upload clang-tidy log
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: ${{ runner.temp }}/tidy.log
          if-no-files-found: ignore
