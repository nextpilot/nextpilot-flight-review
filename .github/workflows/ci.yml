name: ci

# Acceptance gate (contract §7, clauses 10/15): every push to main / PR runs a full build + ctest.
#
# Why a separate workflow: build-packages.yml only builds release packages (PS_BUILD_TESTS=OFF),
# while acceptance clause 15 requires "dead-slot checks in CI" — those two checks
# (test_architecture's table check + test_gui's zero-consumer check) live inside ctest,
# so without this job they would only ever be run by hand locally. This job only does
# Linux + offscreen, enough to catch structural regressions like T1/T3/D13.
#
# NOTE: Same prerequisite as build-packages.yml: this is GitHub Actions configuration.
#   The Gitee primary repository does not run it; the repo must be mirrored to GitHub.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    # Debug has no optimisation: the same translation units cost several times more,
    # so the budget is raised rather than letting a slow Debug matrix time out.
    timeout-minutes: 120
    strategy:
      # One config going red must not hide the other: Debug keeps assert() live while
      # Release compiles it out via NDEBUG, so logic that depends on assertions can only
      # be caught in Debug builds. Both are required.
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential curl file \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            python3 python3-numpy

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install Qt 6.2.4
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          modules: 'qtcharts'

      - name: Python 桥依赖（numpy）
        # 桥的数组旁路（memmap/tofile）硬依赖 numpy。runner 上 PATH 里的 python3 未必是
        # apt 装 python3-numpy 的那个，所以这里对「实际会被桥调用的解释器」再装一次，
        # 并打印 sys.executable 作为证据（否则出现「装了却没生效」的假绿）。
        run: |
          python3 -m pip install --user numpy
          python3 -c "import sys, numpy; print('python:', sys.executable, 'numpy:', numpy.__version__)"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-ci-test-${{ matrix.build_type }}

      - name: Configure CMake
        run: |
          # PS_BUILD_TESTS=ON is the point of this job: it pulls in the ctest suite
          # (test_architecture / test_gui) that enforces the acceptance gate.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPS_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build targets (all, including tests)
        # 与两个跨平台编译门禁同款诊断：失败时 summary 写尾部、并给每条错误一行带上下文的
        # annotation。Linux 的 GNU ar 容忍空归档，最容易出现"绿着但没编出东西"的假绿，
        # 所以 pattern 也覆盖 ar:/ld:/Undefined symbols。
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/build.log"
          if ! { echo "__PS_BUILD_LOG_START__"; cmake --build build -j"$(nproc)"; } 2>&1 | tee "$LOG"; then
            {
              echo '### Build failed on Linux — last 150 lines'
              echo '```'
              tail -150 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            TAIL_LOG="$RUNNER_TEMP/build.tail"
            marker=$(grep -n '__PS_BUILD_LOG_START__' "$LOG" | tail -1 | cut -d: -f1)
            marker=${marker:-0}
            tail -n +"$(( marker + 1 ))" "$LOG" > "$TAIL_LOG"
            PATTERN='error:|error C[0-9]|fatal error|FAILED:|ld: |ar: |Undefined symbols|undefined reference'
            grep -nE "$PATTERN" "$TAIL_LOG" | head -8 | while IFS=: read -r ln _; do
              from=$(( ln > 2 ? ln - 2 : 1 ))
              ctx=$(sed -n "${from},$(( ln + 3 ))p" "$TAIL_LOG" | tr '\n' ' ' | cut -c1-400)
              echo "::error::${ctx}"
            done
            exit 1
          fi

      - name: Run CTest (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          # CI 里不许「缺 numpy 就跳过」：依赖缺失必须是红的，否则 py 路径永远没被覆盖。
          PS_REQUIRE_PY_NUMPY: '1' 
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure

      - name: Print ctest failure summary (always, for diagnostics)
        if: always()
        run: |
          echo "=== LastTestsFailed.log ==="
          cat build/Testing/Temporary/LastTestsFailed.log || echo "(no failure list)"
          echo "=== LastTest.log (tail 300 lines) ==="
          tail -n 300 build/Testing/Temporary/LastTest.log || true

      - name: Upload ctest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.build_type }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # Cross-platform compile gates.
  #
  # Why: the job above only compiles with GCC on Linux. MSVC and AppleClang have their
  # own diagnostics that no amount of local Linux building reproduces — commit 29bf3526
  # ("QLatin1String 错误码去 constexpr, 修 Windows CI C2131") was exactly that class of
  # error, previously found by pushing a packaging branch or by building on a real
  # Windows box. These jobs close that hole at PR time.
  #
  # Scope is deliberately narrow: configure + compile everything, nothing else. No tests
  # (the suite depends on the Python bridge / numpy / offscreen, not yet verified
  # cross-platform), no packaging, no smoke tests — packaging stays in build-packages.yml.

  windows-compile:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # sccache 的本地缓存必须落在 workspace 内。runner 的默认位置不存在，导致
      # ccache-action 的 post 步骤报 "Path Validation Error: Path(s) ... do not exist"，
      # 缓存从来没存上、每次都是全量编译（ci #25 证据）。目录由下面的显式 actions/cache
      # 负责保存/恢复，不再依赖 action 内部猜测的默认路径。
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (MSVC target)
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Qt (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'

      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          # Separate key from the packaging job: this cache only ever holds compile
          # output, so a packaging run cannot evict it.
          key: windows-compile
          variant: sccache

      - name: Restore sccache cache (explicit path)
        # 显式缓存 $SCCACHE_DIR：ccache-action 的 post 步骤指向一个不存在的默认目录，
        # 缓存实际从未落盘。这里自己管路径，key 用少量构建入口文件做指纹（不 hash 全树）。
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-windows-${{ hashFiles('versions.env', 'CMakeLists.txt', 'src/CMakeLists.txt', '.github/workflows/ci.yml') }}
          restore-keys: |
            sccache-windows-

      - name: Configure CMake
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:SCCACHE_DIR | Out-Null
          # QT_ROOT_DIR already contains msvc2019_64 (install-qt-action v4); do not append another level.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DPS_BUILD_TESTS=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build all targets (compile-only gate)
        shell: pwsh
        # All targets, not just the two shipped executables: the point is maximum
        # compile surface, so a broken header in fastplot or the Rust bridge is caught.
        #
        # On failure the tail of the build log goes to the step summary, plus one
        # `::error::` annotation per distinct compiler error — annotations are
        # reliably rendered on the public run page, the summary body is not always
        # exposed in the public HTML.
        run: |
          # 哨兵：Actions 会把本步骤脚本回显进日志，pattern 会误命中外层 Select-String 行。
          # 以哨兵为界，只分析它之后的真实构建输出。
          "__PS_BUILD_LOG_START__" | Out-File -FilePath "$env:RUNNER_TEMP\build.log" -Encoding utf8
          cmake --build build --parallel 4 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build.log" -Append
          if ($LASTEXITCODE -ne 0) {
            "### Build failed on Windows — last 150 lines" | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            '```' | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            Get-Content "$env:RUNNER_TEMP\build.log" -Tail 150 | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            '```' | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            # pattern 必须覆盖真实写法：MSVC 的 "fatal error LNK1181" 没有冒号，
            # 归档/链接失败是 "ar:" / "ld:" / "Undefined symbols"，只写 'error:' 会全漏掉，
            # annotation 只剩一条 FAILED 行（ci #25 就是这样看不出根因）。
            $lines = Get-Content "$env:RUNNER_TEMP\build.log"
            $mark = ($lines | Select-String -Pattern '__PS_BUILD_LOG_START__' | Select-Object -Last 1)
            $start = if ($null -ne $mark) { $mark.LineNumber } else { 0 }
            $body = $lines[$start..($lines.Count - 1)]
            $pattern = 'error:|error LNK|error C[0-9]|fatal error|FAILED:|ld: |ar: |Undefined symbols|undefined reference'
            $hits = $body | Select-String -Pattern $pattern | Select-Object -First 8
            foreach ($hit in $hits) {
              $i = $hit.LineNumber                       # 相对 $body，从 1 开始
              $from = [Math]::Max(1, $i - 2)
              $to = [Math]::Min($body.Count, $i + 3)
              $ctx = ($body[($from - 1)..($to - 1)] -join ' ')
              if ($ctx.Length -gt 400) { $ctx = $ctx.Substring(0, 400) }
              "::error::$ctx"
            }
            exit 1
          }

  macos-compile:
    # GitHub retired the macos-14 hosted image in Nov 2026. A job asking for it is
    # cancelled at once with "The configuration 'macos-14-arm64-us-default' is not
    # supported" and never runs a single step, so this gate silently never executed.
    # macos-15 is the current Apple Silicon image.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install build tools (ninja, Xcode)
        run: |
          command -v ninja || HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja
          xcodebuild -version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          host: mac
          modules: 'qtcharts'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-compile

      - name: Configure CMake
        run: |
          # QT_ROOT_DIR is already an absolute path containing clang_64; do not prepend $(pwd)/.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPS_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build all targets (compile-only gate)
        # A bare "exit code 1" annotation cannot distinguish a Qt 6.2.4 / new-Xcode
        # incompatibility from a real error in our own code, and the Actions log
        # needs an authenticated download. Two channels are used on failure:
        #   1. the step summary (tail of the log), and
        #   2. one `::error::` annotation per distinct compiler error — annotations
        #      are reliably rendered on the public run page, the step summary body
        #      is not always exposed in the public HTML.
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/build.log"
          # 哨兵：Actions 会把本步骤的脚本文本也回显进 tee 的流里，pattern 会误命中外层
          # 的 grep 行。以哨兵为界，只分析它之后的真实构建输出。
          if ! { echo "__PS_BUILD_LOG_START__"; cmake --build build --parallel "$(sysctl -n hw.ncpu)"; } 2>&1 | tee "$LOG"; then
            {
              echo '### Build failed on macOS — last 150 lines'
              echo '```'
              tail -150 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # pattern 要覆盖真实写法：clang 的 "error:"、MSVC 的 "fatal error LNK1181"、
            # 归档/链接的 "ar:" / "ld:" / "Undefined symbols"。只写带冒号的
            # 'error:'/'fatal error:' 会把后几类全漏掉，annotation 只剩 FAILED 行。
            # 每条再带上下文：根因几乎总在 FAILED 的下一两行（如
            # "ar: no archive members specified"）。
            TAIL_LOG="$RUNNER_TEMP/build.tail"
            marker=$(grep -n '__PS_BUILD_LOG_START__' "$LOG" | tail -1 | cut -d: -f1)
            marker=${marker:-0}
            tail -n +"$(( marker + 1 ))" "$LOG" > "$TAIL_LOG"
            PATTERN='error:|error LNK|error C[0-9]|fatal error|FAILED:|ld: |ar: |Undefined symbols|undefined reference'
            grep -nE "$PATTERN" "$TAIL_LOG" | head -8 | while IFS=: read -r ln _; do
              from=$(( ln > 2 ? ln - 2 : 1 ))
              ctx=$(sed -n "${from},$(( ln + 3 ))p" "$TAIL_LOG" | tr '\n' ' ' | cut -c1-400)
              echo "::error::${ctx}"
            done
            exit 1
          fi
