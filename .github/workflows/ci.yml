name: ci

# Acceptance gate (contract §7, clauses 10/15): every push to main / PR runs a full build + ctest.
#
# Why a separate workflow: build-packages.yml only builds release packages (PS_BUILD_TESTS=OFF),
# while acceptance clause 15 requires "dead-slot checks in CI" — those two checks
# (test_architecture's table check + test_gui's zero-consumer check) live inside ctest,
# so without this job they would only ever be run by hand locally. This job only does
# Linux + offscreen, enough to catch structural regressions like T1/T3/D13.
#
# NOTE: Same prerequisite as build-packages.yml: this is GitHub Actions configuration.
#   The Gitee primary repository does not run it; the repo must be mirrored to GitHub.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    # Debug has no optimisation: the same translation units cost several times more,
    # so the budget is raised rather than letting a slow Debug matrix time out.
    timeout-minutes: 120
    strategy:
      # One config going red must not hide the other: Debug keeps assert() live while
      # Release compiles it out via NDEBUG, so logic that depends on assertions can only
      # be caught in Debug builds. Both are required.
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential curl file \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            python3 python3-numpy

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install Qt 6.2.4
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          modules: 'qtcharts'

      - name: Python 桥依赖（numpy）
        # 桥的数组旁路（memmap/tofile）硬依赖 numpy。runner 上 PATH 里的 python3 未必是
        # apt 装 python3-numpy 的那个，所以这里对「实际会被桥调用的解释器」再装一次，
        # 并打印 sys.executable 作为证据（否则出现「装了却没生效」的假绿）。
        run: |
          python3 -m pip install --user numpy
          python3 -c "import sys, numpy; print('python:', sys.executable, 'numpy:', numpy.__version__)"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-ci-test-${{ matrix.build_type }}

      - name: Configure CMake
        run: |
          # PS_BUILD_TESTS=ON is the point of this job: it pulls in the ctest suite
          # (test_architecture / test_gui) that enforces the acceptance gate.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPS_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build targets (all, including tests)
        # 与两个跨平台编译门禁同款诊断：失败时 summary 写尾部、并给每条错误一行带上下文的
        # annotation。Linux 的 GNU ar 容忍空归档，最容易出现"绿着但没编出东西"的假绿，
        # 所以 pattern 也覆盖 ar:/ld:/Undefined symbols。
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/build.log"
          if ! { echo "__PS_BUILD_LOG_START__"; cmake --build build -j"$(nproc)"; } 2>&1 | tee "$LOG"; then
            {
              echo '### Build failed on Linux — last 150 lines'
              echo '```'
              tail -150 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            TAIL_LOG="$RUNNER_TEMP/build.tail"
            marker=$(grep -n '__PS_BUILD_LOG_START__' "$LOG" | tail -1 | cut -d: -f1)
            marker=${marker:-0}
            tail -n +"$(( marker + 1 ))" "$LOG" > "$TAIL_LOG"
            PATTERN='error:|error C[0-9]|fatal error|FAILED:|ld: |ar: |Undefined symbols|undefined reference'
            grep -nE "$PATTERN" "$TAIL_LOG" | head -8 | while IFS=: read -r ln _; do
              # 上下文 = 命中行 + 后 2 行，每行各自截 120 字符再拼接。
              # 不能先拼接再整体截 400：ninja 的失败块是「FAILED:」+ 一整条几千字符的
              # 链接命令行 + 真正的错误行，先拼接会被长命令行吃满，LNK1181 / ar: 这类
              # 根因整行丢掉（ci #26 Windows 注解就是这样只剩命令行前缀）。
              ctx=$(sed -n "${ln},$(( ln + 2 ))p" "$TAIL_LOG" | cut -c1-120 | tr '\n' ' ' | sed 's/[[:space:]]*$//')
              echo "::error::${ctx}"
            done
            exit 1
          fi

      - name: Run CTest (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          # CI 里不许「缺 numpy 就跳过」：依赖缺失必须是红的，否则 py 路径永远没被覆盖。
          PS_REQUIRE_PY_NUMPY: '1' 
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure

      - name: ps_gui 稳定性探针（非阻断）
        if: always()
        # ps_gui 在 CI 上偶发 SegFault：Windows 第五轮、Linux Release 第七轮各一次，都崩在
        # dock 首帧焦点之后（1.5~1.8 s 就死）。本步串行重跑 5 次只为拿复现率，不参与判定：
        # 主跑的 ctest 已经对这轮给过一次结论，探针红了只写摘要。
        # 只统计复现率是没用的——崩了 8 轮也就两个数字。探针改成正向取证：
        # 直接跑二进制，任何一个 run 出现段错误就翻 core 文件用 gdb 打 backtrace，
        # 打不到就 gdb 重跑一次抓现场。下次再崩，日志里会带真实调用栈。
        run: |
          set +e
          BIN="$(find build -type f -name 'ps_test_gui' | head -1)"
          if [ -z "$BIN" ]; then
            echo "没找到 ps_test_gui 二进制（该轮可能没编测试目标），跳过探针" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          out="$RUNNER_TEMP/psgui"; mkdir -p "$out"
          sudo apt-get install -y -qq gdb >/dev/null 2>&1
          ulimit -c unlimited
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern 2>/dev/null || echo '(unreadable)')"
          crashes=0
          for i in $(seq 1 8); do
            QT_QPA_PLATFORM=offscreen timeout 60 "$BIN" > "$out/run$i.log" 2>&1
            rc=$?
            echo "run$i rc=$rc"
            if [ "$rc" -ge 128 ]; then
              crashes=$((crashes + 1))
              echo "=== run$i 崩溃（rc=$rc），抓堆栈 ==="
              # 不用 ls 挑最新 core（shellcheck SC2012/SC2010）：find + stat 按 mtime 排序，
              # 文件名里出现空格或非字母数字也不会解析错。
              CORE="$(find "$out" . -maxdepth 3 -type f \( -name 'core' -o -name 'core.*' \) -print0 2>/dev/null \
                | xargs -0 -r stat -c '%Y %n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)"
              if [ -n "$CORE" ] && [ -f "$CORE" ]; then
                echo "core: $CORE"
                gdb -batch -ex 'bt' -ex 'info registers' "$BIN" "$CORE" 2>&1 | tail -80
              else
                echo "(无 core 文件，gdb 重跑一次取现场)"
                gdb -batch -ex run -ex 'bt' --args "$BIN" 2>&1 | tail -80
              fi
              echo "--- run$i 输出 ---"
              tail -40 "$out/run$i.log"
            fi
          done
          echo "ps_gui 探针：8 次运行，崩溃 $crashes 次" >> "$GITHUB_STEP_SUMMARY"
          if [ "$crashes" -gt 0 ]; then
            {
              echo '### ps_gui 探针复现崩溃，堆栈见本例日志'
              echo '```'
              tail -60 "$out"/run*.log 2>/dev/null | tail -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Smoke test - GUI starts (offscreen)
        # ctest 覆盖不到「GUI 能不能真的起窗」：编译通过、单测全绿，进程仍可能因为平台
        # 插件缺失或启动路径断裂而一启动就崩。
        #
        # 判定口径是「起来且不崩」，不是「必须挂住」：本地实测 offscreen 下它起窗后会
        # 正常自退（rc=0），而打包环境里同样的二进制会一直挂住（rc=124）。两种都不是失败，
        # 真正的失败是段错误（139）、abort（134）或 Qt 报找不到平台插件。
        run: |
          set +e
          LOG="$RUNNER_TEMP/gui-smoke.log"
          QT_QPA_PLATFORM=offscreen timeout 10 build/src/application/assembly/plotscope-gui \
            > "$LOG" 2>&1
          rc=$?
          set -e
          cat "$LOG"
          if grep -qiE 'could not (find|load) the Qt platform plugin|Segmentation fault|Aborted' "$LOG"; then
            echo "::error::plotscope-gui failed to start (see log above)"
            exit 1
          fi
          case "$rc" in
            0|124|143) echo "GUI offscreen smoke test passed (rc=$rc, no crash)" ;;
            *) echo "::error::plotscope-gui exited abnormally (rc=$rc)"; exit 1 ;;
          esac

      - name: Print ctest failure summary (always, for diagnostics)
        if: always()
        run: |
          echo "=== LastTestsFailed.log ==="
          cat build/Testing/Temporary/LastTestsFailed.log || echo "(no failure list)"
          echo "=== LastTest.log (tail 300 lines) ==="
          tail -n 300 build/Testing/Temporary/LastTest.log || true

      - name: Upload ctest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.build_type }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # Second compiler on Linux. GCC and Clang disagree on a lot that matters for portability:
  # -W flag acceptance, implicit conversion diagnostics, and GNU extensions that GCC tolerates
  # silently. Only Clang catches that class at PR time; macOS uses AppleClang, so a Linux
  # Clang leg also de-risks the macOS gate.
  #
  # Release only, not the Release/Debug pair: the compiler portability signal does not
  # depend on optimisation level, and doubling an already long leg buys nothing.
  test-clang:
    name: test (Release, clang)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies (including clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential clang curl file \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            python3 python3-numpy
          clang --version
          clang++ --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          modules: 'qtcharts'

      - name: Python 桥依赖（numpy）
        run: |
          python3 -m pip install --user numpy
          python3 -c "import sys, numpy; print('python:', sys.executable, 'numpy:', numpy.__version__)"

      - name: Set up ccache
        # Separate key: ccache objects are compiler-specific, sharing them with the GCC
        # legs would just waste the cache budget on guaranteed misses.
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-ci-test-clang

      - name: Configure CMake (clang)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPS_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build targets (all, including tests)
        run: cmake --build build -j"$(nproc)"

      - name: Run CTest (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PS_REQUIRE_PY_NUMPY: '1'
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure

      - name: Print ctest failure summary (always, for diagnostics)
        if: always()
        run: tail -n 200 build/Testing/Temporary/LastTest.log || true

  # Sanitizer leg. The regression it exists for: `ps_plot_io` held a lambda connected to a
  # canvas that outlived the block, so it read a destroyed stack slot. GCC -O3 happened to pass
  # (the slot was not overwritten yet), Clang -O3 segfaulted on every run, and the suite had no
  # leg that could tell the difference — four red CI runs were needed before it was found locally
  # with ASan. ASan/UBSan turns that class into a first-class signal at PR time.
  #
  # Scope: tests ON, ccache ON but under its own cache key/dir. Sanitizer objects must never
  # be *restored* from a plain build's cache, yet they are perfectly reusable across sanitizer
  # runs: ccache hashes the compiler command line, so -fsanitize=... never collides with a plain
  # Release object. Turning the cache off entirely used to cost ~20 min per run (603 targets
  # from scratch); an isolated key makes later runs incremental without mixing the two worlds.
  # -fno-sanitize=vptr is deliberate: vptr checks fire inside the bundled ads library whenever a
  # QPointer<CDockManager> is touched during CDockManager's own destruction (vptr already rolled
  # back to CDockContainerWidget). That is a well-known false positive for this pattern, and
  # leaving it on would red the leg permanently instead of catching our own UB.
  test-sanitizers:
    name: test (Release, asan+ubsan)
    runs-on: ubuntu-22.04
    # Sanitizer instrumentation is several times slower than a plain Release build. The isolated
    # cache below absorbs most of that: the first run on a key still compiles the whole tree.
    timeout-minutes: 180
    env:
      QT_QPA_PLATFORM: offscreen
      PS_REQUIRE_PY_NUMPY: '1'
      # Qt leaves heap blocks behind on exit; leak detection would only produce noise here.
      ASAN_OPTIONS: detect_leaks=0
      # UBSan is recover-only on day one: the bundled Lua / ads / saribbon sources are compiled
      # into this leg too, and their known UB would red the gate permanently before we have
      # triaged a single line of our own. Memory errors (ASan) still abort and fail the test;
      # UBSan findings are counted and surfaced in the step summary instead (see the report step).
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential curl file \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            python3 python3-numpy

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          modules: 'qtcharts'

      # 独立 key：不与 Linux Release/Debug/clang 三条腿共享缓存（对象可以复用，
      # 但两条腿的构建目录、参数语义完全不同，混在一起只会让命中率统计失真）。
      - name: Set up ccache (sanitizer, isolated)
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-ci-sanitizers
          max-size: 2G

      - name: Python 桥依赖（numpy）
        run: |
          python3 -m pip install --user numpy
          python3 -c "import sys, numpy; print('python:', sys.executable, 'numpy:', numpy.__version__)"

      - name: Configure CMake (ASan + UBSan)
        run: |
          SAN='-fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer'
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPS_BUILD_TESTS=ON \
            -DPS_USE_CCACHE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="$SAN" \
            -DCMAKE_CXX_FLAGS="$SAN" \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build targets (all, including tests)
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/build.log"
          if ! { echo "__PS_BUILD_LOG_START__"; cmake --build build -j"$(nproc)"; } 2>&1 | tee "$LOG"; then
            {
              echo '### Build failed on the sanitizer leg — last 150 lines'
              echo '```'
              tail -150 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Run CTest (offscreen)
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure

      - name: Report sanitizer findings (always)
        if: always()
        # 把「存量 UB」变成可读数字：UBSan recover-only 不会让腿变红，如果不统计就等于没说。
        # ASan 错误本身已经让用例失败（abort），这里只做汇总，不重复阻断。
        run: |
          LOG=build/Testing/Temporary/LastTest.log
          [ -f "$LOG" ] || { echo "(no LastTest.log yet)"; exit 0; }
          ASAN=$(grep -c 'ERROR: AddressSanitizer' "$LOG" || true)
          UBSAN=$(grep -c 'runtime error:' "$LOG" || true)
          {
            echo "### Sanitizer findings"
            echo ""
            echo "- AddressSanitizer errors: ${ASAN}"
            echo "- UBSan runtime errors: ${UBSAN}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "asan=${ASAN} ubsan=${UBSAN}"
          if [ "${UBSAN}" -gt 0 ]; then
            echo '--- first 20 UBSan findings ---'
            grep 'runtime error:' "$LOG" | head -20
          fi

      - name: Print ctest failure summary (always, for diagnostics)
        if: always()
        run: |
          echo "=== LastTestsFailed.log ==="
          cat build/Testing/Temporary/LastTestsFailed.log || echo "(no failure list)"
          echo "=== LastTest.log (tail 300 lines) ==="
          tail -n 300 build/Testing/Temporary/LastTest.log || true

      - name: Upload ctest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-sanitizers
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # Configure-only matrix. The gate above always configures with tests ON and ccache ON,
  # and packaging configures with tests OFF — the rest of the option space was never
  # exercised. That is exactly where IKY124 lived: an INTERFACE-only target declaring
  # STATIC properties fails at *configure* time, never reaching compilation, so no build
  # job would ever see it. Configure is cheap (seconds), so this covers the matrix without
  # duplicating hours of compilation.
  config-matrix:
    name: configure (${{ matrix.label }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: tests-off, ccache-off
            opts: -DPS_BUILD_TESTS=OFF -DPS_USE_CCACHE=OFF
          - label: tests-on, ccache-off
            opts: -DPS_BUILD_TESTS=ON -DPS_USE_CCACHE=OFF
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential curl file \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          modules: 'qtcharts'

      - name: Configure CMake (${{ matrix.label }})
        run: |
          # No build step on purpose (see the job comment): configure-time failures are the
          # target, and building every permutation would double the workflow runtime.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            ${{ matrix.opts }}
          echo "configure OK: ${{ matrix.label }}"

  # Cross-platform compile gates.
  #
  # Why: the job above only compiles with GCC on Linux. MSVC and AppleClang have their
  # own diagnostics that no amount of local Linux building reproduces — commit 29bf3526
  # ("QLatin1String 错误码去 constexpr, 修 Windows CI C2131") was exactly that class of
  # error, previously found by pushing a packaging branch or by building on a real
  # Windows box. These jobs close that hole at PR time.
  #
  # Scope: configure + compile + ctest. Packaging and GUI smoke stay elsewhere
  # (build-packages.yml / the Linux leg). Tests were previously excluded here because the
  # suite pulls in the Python bridge, numpy and an offscreen platform — all of which are
  # available on both hosted images now, so "compiles but has never executed a line" is no
  # longer an acceptable gate for the two platforms that differ most from Linux.

  windows-compile:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # sccache 的本地缓存必须落在 workspace 内。runner 的默认位置不存在，导致
      # ccache-action 的 post 步骤报 "Path Validation Error: Path(s) ... do not exist"，
      # 缓存从来没存上、每次都是全量编译（ci #25 证据）。目录由下面的显式 actions/cache
      # 负责保存/恢复，不再依赖 action 内部猜测的默认路径。
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      # 命中率口径：sccache 的 MSVC 参数解析不认 /pathmap，会把 "/pathmap:<abs>=build"
      # 当成第二个输入文件，于是每条 cl.exe 命令都被判为 "multiple input files" 而拒绝
      # 缓存。这里不靠环境变量绕过，而是让 CMake 在 sccache 作启动器时不加 /pathmap
      # （见 CMakeLists.txt 的 MSVC 分支）。改这两处任何一处都要重跑一次 windows-compile。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (MSVC target)
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Qt (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'

      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          # Separate key from the packaging job: this cache only ever holds compile
          # output, so a packaging run cannot evict it.
          key: windows-compile
          variant: sccache

      - name: Restore sccache cache (explicit path)
        # 显式缓存 $SCCACHE_DIR：ccache-action 的 post 步骤指向一个不存在的默认目录，
        # 缓存实际从未落盘。这里自己管路径，key 用少量构建入口文件做指纹（不 hash 全树）。
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-windows-${{ hashFiles('versions.env', 'CMakeLists.txt', 'src/CMakeLists.txt', '.github/workflows/ci.yml') }}
          restore-keys: |
            sccache-windows-

      - name: Configure CMake
        shell: pwsh
        # PS_BUILD_TESTS=ON since the ctest leg landed: MSVC + MS STL is the platform where
        # "compiles" most often differs from "runs correctly", so this gate now executes the
        # suite instead of stopping at the link step.
        run: |
          New-Item -ItemType Directory -Force -Path $env:SCCACHE_DIR | Out-Null
          # QT_ROOT_DIR already contains msvc2019_64 (install-qt-action v4); do not append another level.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DPS_BUILD_TESTS=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build all targets (compile-only gate)
        shell: pwsh
        # All targets, not just the two shipped executables: the point is maximum
        # compile surface, so a broken header in fastplot or the Rust bridge is caught.
        #
        # On failure the tail of the build log goes to the step summary, plus one
        # `::error::` annotation per distinct compiler error — annotations are
        # reliably rendered on the public run page, the summary body is not always
        # exposed in the public HTML.
        run: |
          # 哨兵：Actions 会把本步骤脚本回显进日志，pattern 会误命中外层 Select-String 行。
          # 以哨兵为界，只分析它之后的真实构建输出。
          "__PS_BUILD_LOG_START__" | Out-File -FilePath "$env:RUNNER_TEMP\build.log" -Encoding utf8
          cmake --build build --parallel 4 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build.log" -Append
          if ($LASTEXITCODE -ne 0) {
            "### Build failed on Windows — last 150 lines" | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            '```' | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            Get-Content "$env:RUNNER_TEMP\build.log" -Tail 150 | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            '```' | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            # pattern 必须覆盖真实写法：MSVC 的 "fatal error LNK1181" 没有冒号，
            # 归档/链接失败是 "ar:" / "ld:" / "Undefined symbols"，只写 'error:' 会全漏掉，
            # annotation 只剩一条 FAILED 行（ci #25 就是这样看不出根因）。
            $lines = Get-Content "$env:RUNNER_TEMP\build.log"
            $mark = ($lines | Select-String -Pattern '__PS_BUILD_LOG_START__' | Select-Object -Last 1)
            $start = if ($null -ne $mark) { $mark.LineNumber } else { 0 }
            $body = $lines[$start..($lines.Count - 1)]
            $pattern = 'error:|error LNK|error C[0-9]|fatal error|FAILED:|ld: |ar: |Undefined symbols|undefined reference'
            $hits = $body | Select-String -Pattern $pattern | Select-Object -First 8
            foreach ($hit in $hits) {
              $i = $hit.LineNumber                       # 相对 $body，从 1 开始
              # 上下文 = 命中行 + 后 2 行，逐行截 120 字符再拼接。整段拼接后截 400 会让
              # 几千字符的链接命令行把随后的 "LINK : fatal error LNK1181" 整行吃掉，
              # 于是注解里只剩 FAILED 和 cmd.exe 前缀（ci #26 实测）。
              $to = [Math]::Min($body.Count, $i + 2)
              $ctx = ($body[($i - 1)..($to - 1)] | ForEach-Object {
                if ($_.Length -gt 120) { $_.Substring(0, 120) } else { $_ }
              }) -join ' '
              "::error::$ctx"
            }
            exit 1
          }

      - name: Provide fonts for the offscreen font engine
        shell: pwsh
        # Windows 的 offscreen 插件走 QBasicFontDatabase，只从 <Qt>/lib/fonts 读字体；Qt 6 起官方
        # 不再随包发字体，启动时便报 "Cannot find font directory"，零警告冒烟随之变红。
        # 实测（run 45768458092）：喂入 arial/segoeui/consola 后 ps_shell_bare_smoke 单独跑 1/1
        # Passed、无字体警告 —— 所以它已经不再是环境噪音，主跑恢复严格口径，不再排除。
        run: |
          $dir = Join-Path $env:QT_ROOT_DIR "lib\fonts"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($f in @("arial.ttf", "segoeui.ttf", "consola.ttf", "times.ttf")) {
            $src = Join-Path "C:\Windows\Fonts" $f
            if (Test-Path $src) { Copy-Item $src $dir -Force }
          }
          Get-ChildItem $dir | Select-Object -ExpandProperty Name

      - name: Run CTest (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        # Qt's bin dir is on PATH via install-qt-action and ps_deploy_windows_runtime_all()
        # copies the dlls next to every executable, so the tests start without a PATH fix.
        # PS_REQUIRE_PY_NUMPY is deliberately not set: windows-2022 has no guaranteed `python3`
        # alias, and a missing interpreter must degrade to a skipped ps_python, not red the leg.
        # ps_shell_bare_smoke 恢复进主跑：字体步骤喂好 <Qt>\lib\fonts 之后它已实测转绿
        # （1/1 Passed），这条腿和 Linux 一样承担「启动零警告」的严格口径。
        run: |
          ctest --test-dir build -j 4 --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            "### ctest failed on Windows" | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            '```' | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            if (Test-Path build\Testing\Temporary\LastTest.log) {
              Get-Content build\Testing\Temporary\LastTest.log -Tail 150 | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            }
            '```' | Out-File -Append "$env:GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: UI driver smoke (offscreen render + screenshot)
        shell: pwsh
        # ps_ui_driver 走的是和 fastplot 同一套 offscreen 软件光栅，ctest 从不执行它（它只是
        # 构建出来的工具）。跑一遍 overview.json：起窗 → 装载 fixture → 全部通道上图 → 截图
        # 落盘，一次把「GUI 能起、能渲染、能出像素」三件事验证掉。
        # CWD 保持仓库根：脚本里的 fixture 是相对仓库根的路径。
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ui-driver"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & .\build\tests\ps_ui_driver.exe --script docs/screenshots/scripts/overview.json `
            --out-dir $out --width 1280 --height 800
          if ($LASTEXITCODE -ne 0) { throw "ps_ui_driver exited with $LASTEXITCODE" }
          $shot = Join-Path $out "PlotScope-Overview.png"
          if (-not (Test-Path $shot)) { throw "no screenshot produced: $shot" }
          $len = (Get-Item $shot).Length
          if ($len -lt 10000) { throw "screenshot suspiciously small: $len bytes" }
          "ui-driver screenshot OK: $len bytes" | Out-File -Append "$env:GITHUB_STEP_SUMMARY"

  macos-compile:
    # GitHub retired the macos-14 hosted image in Nov 2026. A job asking for it is
    # cancelled at once with "The configuration 'macos-14-arm64-us-default' is not
    # supported" and never runs a single step, so this gate silently never executed.
    # macos-15 is the current Apple Silicon image.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install build tools (ninja, Xcode)
        run: |
          command -v ninja || HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja
          xcodebuild -version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          host: mac
          modules: 'qtcharts'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-compile

      - name: Configure CMake
        run: |
          # QT_ROOT_DIR is already an absolute path containing clang_64; do not prepend $(pwd)/.
          # PS_BUILD_TESTS=ON: AppleClang + arm64 is a different ABI from the Linux legs,
          # and fastplot's floating point / LOD paths are exactly where "compiles" stops
          # being evidence. The suite runs below.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPS_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build all targets (compile-only gate)
        # A bare "exit code 1" annotation cannot distinguish a Qt 6.2.4 / new-Xcode
        # incompatibility from a real error in our own code, and the Actions log
        # needs an authenticated download. Two channels are used on failure:
        #   1. the step summary (tail of the log), and
        #   2. one `::error::` annotation per distinct compiler error — annotations
        #      are reliably rendered on the public run page, the step summary body
        #      is not always exposed in the public HTML.
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/build.log"
          # 哨兵：Actions 会把本步骤的脚本文本也回显进 tee 的流里，pattern 会误命中外层
          # 的 grep 行。以哨兵为界，只分析它之后的真实构建输出。
          if ! { echo "__PS_BUILD_LOG_START__"; cmake --build build --parallel "$(sysctl -n hw.ncpu)"; } 2>&1 | tee "$LOG"; then
            {
              echo '### Build failed on macOS — last 150 lines'
              echo '```'
              tail -150 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # pattern 要覆盖真实写法：clang 的 "error:"、MSVC 的 "fatal error LNK1181"、
            # 归档/链接的 "ar:" / "ld:" / "Undefined symbols"。只写带冒号的
            # 'error:'/'fatal error:' 会把后几类全漏掉，annotation 只剩 FAILED 行。
            # 上下文一律取「命中行 + 后 2 行」，且每行各自截 120 字符再拼接。
            # 不能先拼接再整体截 400：ninja 的失败块是「FAILED:」+ 一整条几千字符的
            # 链接命令行 + 真正的错误行，先拼接会被长命令行吃满，根因整行丢掉
            # （ci #26 Windows 注解就是这样只剩命令行前缀，看不到 LNK1181）。
            TAIL_LOG="$RUNNER_TEMP/build.tail"
            marker=$(grep -n '__PS_BUILD_LOG_START__' "$LOG" | tail -1 | cut -d: -f1)
            marker=${marker:-0}
            tail -n +"$(( marker + 1 ))" "$LOG" > "$TAIL_LOG"
            PATTERN='error:|error LNK|error C[0-9]|fatal error|FAILED:|ld: |ar: |Undefined symbols|undefined reference'
            grep -nE "$PATTERN" "$TAIL_LOG" | head -8 | while IFS=: read -r ln _; do
              from=$(( ln > 2 ? ln - 2 : 1 ))
              ctx=$(sed -n "${from},$(( ln + 3 ))p" "$TAIL_LOG" | tr '\n' ' ' | cut -c1-400)
              echo "::error::${ctx}"
            done
            exit 1
          fi

      - name: Python 桥依赖（numpy）
        # ps_python 会用 findExecutable("python3") 找解释器，runner 上那个 python3 未必装了
        # numpy；这里对实际会被调用的解释器再装一次并打印 sys.executable 作为证据。
        # macOS 的 brew python 带 PEP 668 标记时会拒绝 --user 安装，回退到
        # --break-system-packages（老 pip 不认识这个参数，所以先试不带它的写法）。
        run: |
          python3 -m pip install --user numpy \
            || python3 -m pip install --user --break-system-packages numpy
          python3 -c "import sys, numpy; print('python:', sys.executable, 'numpy:', numpy.__version__)"

      - name: Run CTest (offscreen)
        env:
          # offscreen 让 GUI 用例在无窗口会话的 shell 里也能起窗；与 Linux 腿同口径。
          QT_QPA_PLATFORM: offscreen
          # macOS runner 一定有 python3，所以这里按严格口径：numpy 缺失要红，不能靠跳过变绿。
          PS_REQUIRE_PY_NUMPY: '1'
        # ps_shell_bare_smoke 排除：它要求「启动零警告」，而 macOS 的 offscreen 插件走 CoreText，
        # 会报 missing font family "Sans Serif"。喂字体到 <Qt>/lib/fonts 对 macOS 无效 —— 实测
        # （run 45762239698）把 Arial.ttf 拷进去后警告与判定一字未变，故该步骤已移除。
        # 严格口径由 Linux 腿（fontconfig）与 Windows 腿（QBasicFontDatabase + lib/fonts）承担。
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/ctest.log"
          if ! ctest --test-dir build -j"$(sysctl -n hw.ncpu)" --output-on-failure \
            -E "ps_shell_bare_smoke" 2>&1 | tee "$LOG"; then
            {
              echo '### ctest failed on macOS — last 150 lines'
              echo '```'
              tail -150 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: UI driver smoke (offscreen render + screenshot)
        # 与 Windows 腿同一条冒烟：ps_ui_driver 是构建出来的工具、不进 ctest，这里用
        # overview.json 把「GUI 起窗 → 渲染 → 截图落盘」跑一遍（脚本内已 qputenv offscreen）。
        # CWD 是仓库根，脚本里的 fixture 相对路径才成立。
        run: |
          OUT="$RUNNER_TEMP/ui-driver"
          mkdir -p "$OUT"
          ./build/tests/ps_ui_driver --script docs/screenshots/scripts/overview.json \
            --out-dir "$OUT" --width 1280 --height 800
          SHOT="$OUT/PlotScope-Overview.png"
          [ -f "$SHOT" ] || { echo "::error::no screenshot produced: $SHOT"; exit 1; }
          SIZE=$(wc -c < "$SHOT" | tr -d ' ')
          [ "$SIZE" -ge 10000 ] || { echo "::error::screenshot suspiciously small: $SIZE bytes"; exit 1; }
          echo "ui-driver screenshot OK: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
