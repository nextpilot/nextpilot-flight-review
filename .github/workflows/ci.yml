name: ci

# Acceptance gate (contract §7, clauses 10/15): every push to main / PR runs a full build + ctest.
#
# Why a separate workflow: build-packages.yml only builds release packages (PS_BUILD_TESTS=OFF),
# while acceptance clause 15 requires "dead-slot checks in CI" — those two checks
# (test_architecture's table check + test_gui's zero-consumer check) live inside ctest,
# so without this job they would only ever be run by hand locally. This job only does
# Linux + offscreen, enough to catch structural regressions like T1/T3/D13.
#
# NOTE: Same prerequisite as build-packages.yml: this is GitHub Actions configuration.
#   The Gitee primary repository does not run it; the repo must be mirrored to GitHub.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    # Debug has no optimisation: the same translation units cost several times more,
    # so the budget is raised rather than letting a slow Debug matrix time out.
    timeout-minutes: 120
    strategy:
      # One config going red must not hide the other: Debug keeps assert() live while
      # Release compiles it out via NDEBUG, so logic that depends on assertions can only
      # be caught in Debug builds. Both are required.
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential curl file \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            python3 python3-numpy

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install Qt 6.2.4
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          modules: 'qtcharts'

      - name: Python 桥依赖（numpy）
        # 桥的数组旁路（memmap/tofile）硬依赖 numpy。runner 上 PATH 里的 python3 未必是
        # apt 装 python3-numpy 的那个，所以这里对「实际会被桥调用的解释器」再装一次，
        # 并打印 sys.executable 作为证据（否则出现「装了却没生效」的假绿）。
        run: |
          python3 -m pip install --user numpy
          python3 -c "import sys, numpy; print('python:', sys.executable, 'numpy:', numpy.__version__)"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-ci-test-${{ matrix.build_type }}

      - name: Configure CMake
        run: |
          # PS_BUILD_TESTS=ON is the point of this job: it pulls in the ctest suite
          # (test_architecture / test_gui) that enforces the acceptance gate.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPS_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build targets (all, including tests)
        run: cmake --build build -j"$(nproc)"

      - name: Run CTest (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          # CI 里不许「缺 numpy 就跳过」：依赖缺失必须是红的，否则 py 路径永远没被覆盖。
          PS_REQUIRE_PY_NUMPY: '1' 
        run: ctest --test-dir build -j"$(nproc)" --output-on-failure

      - name: Print ctest failure summary (always, for diagnostics)
        if: always()
        run: |
          echo "=== LastTestsFailed.log ==="
          cat build/Testing/Temporary/LastTestsFailed.log || echo "(no failure list)"
          echo "=== LastTest.log (tail 300 lines) ==="
          tail -n 300 build/Testing/Temporary/LastTest.log || true

      - name: Upload ctest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.build_type }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # Cross-platform compile gates.
  #
  # Why: the job above only compiles with GCC on Linux. MSVC and AppleClang have their
  # own diagnostics that no amount of local Linux building reproduces — commit 29bf3526
  # ("QLatin1String 错误码去 constexpr, 修 Windows CI C2131") was exactly that class of
  # error, previously found by pushing a packaging branch or by building on a real
  # Windows box. These jobs close that hole at PR time.
  #
  # Scope is deliberately narrow: configure + compile everything, nothing else. No tests
  # (the suite depends on the Python bridge / numpy / offscreen, not yet verified
  # cross-platform), no packaging, no smoke tests — packaging stays in build-packages.yml.

  windows-compile:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (MSVC target)
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Qt (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'

      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          # Separate key from the packaging job: this cache only ever holds compile
          # output, so a packaging run cannot evict it.
          key: windows-compile
          variant: sccache

      - name: Configure CMake
        shell: pwsh
        run: |
          # QT_ROOT_DIR already contains msvc2019_64 (install-qt-action v4); do not append another level.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DPS_BUILD_TESTS=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build all targets (compile-only gate)
        shell: pwsh
        # All targets, not just the two shipped executables: the point is maximum
        # compile surface, so a broken header in fastplot or the Rust bridge is caught.
        run: cmake --build build --parallel 4

  macos-compile:
    # GitHub retired the macos-14 hosted image in Nov 2026. A job asking for it is
    # cancelled at once with "The configuration 'macos-14-arm64-us-default' is not
    # supported" and never runs a single step, so this gate silently never executed.
    # macos-15 is the current Apple Silicon image.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version (versions.env is the single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          echo "PS_QT_VER=${PS_QT_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install build tools (ninja, Xcode)
        run: |
          command -v ninja || HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja
          xcodebuild -version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PS_QT_VER }}
          host: mac
          modules: 'qtcharts'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-compile

      - name: Configure CMake
        run: |
          # QT_ROOT_DIR is already an absolute path containing clang_64; do not prepend $(pwd)/.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPS_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build all targets (compile-only gate)
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"
