# Python 静态类型检查配置（mypy）。
#
# 范围刻意窄：只查仓库自己维护的脚本。src/3rdparty/ 里的第三方脚本不进范围——
# 那是上游代码，改不动也不该为它的类型问题背锅。
#
# 口径与 clang-tidy 那条腿一致：先量基线、清零，再设为硬门禁。当前基线已经是 0，
# 所以这里直接阻断（CI 见 .github/workflows/lint.yml 的 python-types job）。
# 新增脚本在 tools/ 下会自动进入范围，不需要逐文件登记。

[mypy]
python_version = 3.12
# mypy 的 files 值按逗号分隔（换行会被拼成单个路径，实测报 "Cannot read file"）。
files = tools, tests/fixture, src/application/modules/script/resources

# pymavlink / pyubx2 / pynmea2 都没有类型桩包，缺桩时按 Any 处理而不是报错。
ignore_missing_imports = True

# 把「多余的 cast / 无用 ignore」也当错误：这类残留会让后续读者误判类型真相。
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True

show_error_codes = True
pretty = True
