[workspace]
resolver = "2"
members = [
    "ps-abi",
    "ps-ndf",
    "ps-ops",
    "ps-cache",
    "ps-dag",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
authors = ["NextPilot"]

[workspace.dependencies]
ps-abi = { path = "ps-abi" }
ps-ndf = { path = "ps-ndf" }
ps-ops = { path = "ps-ops" }
ps-cache = { path = "ps-cache" }
ps-dag = { path = "ps-dag" }
