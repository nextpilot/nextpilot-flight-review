[workspace]
resolver = "2"
members = [
    "ps-abi",
    "ps-ndf",
    "ps-parse",
    "ps-ops",
    "ps-script",
    "ps-align",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
authors = ["NextPilot"]

[workspace.dependencies]
ps-abi = { path = "ps-abi" }
ps-ndf = { path = "ps-ndf" }
ps-parse = { path = "ps-parse" }
ps-ops = { path = "ps-ops" }
ps-script = { path = "ps-script" }
ps-align = { path = "ps-align" }
